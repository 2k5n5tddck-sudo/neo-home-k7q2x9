<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 하루">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Neo_m1 x panner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 한 칸짜리 세로 시간표. 위에 오늘 날짜와 진행 링, 그 아래 응원 한마디, 아래는 시간 레일을 따라 내려가는 할 일 목록. */
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --ink: #141830;
    --muted: #454d6b;
    --line: #c9d0e4;
    --sun: #6f6bd1;
    --sun-soft: #e9e8fa;
    --done: #b05580;
    --done-soft: #f7e4ed;
    --danger: #b3384f;
    --pink: #e07aa3;
    --pink-soft: #fdeaf2;
    --blue: #4f86d6;
    --blue-soft: #e6effc;
    --green: #4cb088;
    --green-ink: #1f7a55;
    --green-soft: #e3f5ec;
    --purple: #9a7ee0;
    --purple-ink: #5b38b8;
    --purple-soft: #eee8fc;
    --font-display: "Gowun Batang", "Noto Serif KR", serif;
    --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141829; --surface: #1c2136; --ink: #f6f7ff; --muted: #bac1dd; --line: #2d3454;
      --sun: #a9a6f2; --sun-soft: #2a2a52; --done: #e48fb3; --done-soft: #3a2236; --danger: #f08a9c;
      --pink: #ee9bbd; --pink-soft: #3a2433;
      --blue: #8fb4f0; --blue-soft: #1f2d47;
      --green: #6fd0a4; --green-ink: #7fd9ae; --green-soft: #1b3a2e;
      --purple: #a78bf0; --purple-ink: #d2c2ff; --purple-soft: #2a2250;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141829; --surface: #1c2136; --ink: #f6f7ff; --muted: #bac1dd; --line: #2d3454;
    --sun: #a9a6f2; --sun-soft: #2a2a52; --done: #e48fb3; --done-soft: #3a2236; --danger: #f08a9c;
    --pink: #ee9bbd; --pink-soft: #3a2433;
    --blue: #8fb4f0; --blue-soft: #1f2d47;
    --green: #6fd0a4; --green-ink: #7fd9ae; --green-soft: #1b3a2e;
    --purple: #a78bf0; --purple-ink: #d2c2ff; --purple-soft: #2a2250;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; font-weight: 500; line-height: 1.55;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .top > div { min-width: 0; }
  .greet { margin: 0; color: var(--muted); font-size: 0.95rem; }
  h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.15; text-wrap: balance; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--sun); transition: stroke-dashoffset .5s ease, stroke .3s; }
  .ring.full .bar { stroke: var(--done); }
  .ring .count { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .count small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); text-align: center; line-height: 1; }
  .ring .count span { text-align: center; line-height: 1.1; }

  .cheer { background: var(--purple-soft); border: 1px solid var(--purple); border-radius: 14px; padding: 10px 12px 10px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; }
  .cheer .label { margin: 0; font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
  .cheer p.msg { margin: 0; color: var(--purple-ink); font-size: 1rem; font-weight: 500; line-height: 1.45; text-wrap: balance; }
  .cheer .status { grid-column: 1 / -1; margin: 0; font-size: .8rem; color: var(--muted); }
  .cheer button { justify-self: end; background: transparent; color: var(--purple-ink); border: 1px solid var(--purple); border-radius: 50%; width: 36px; height: 36px; padding: 0; cursor: pointer; font-size: 1rem; line-height: 1; }
  .cheer button:hover { background: var(--surface); }
  .cheer.full { border-color: var(--purple-ink); }

  h2 { margin: 0; font-size: 1rem; font-weight: 700; }
  .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .listhead span { color: var(--muted); font-size: .85rem; }

  ol.rail { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  ol.rail li { display: grid; grid-template-columns: 56px 20px minmax(0, 1fr); column-gap: 10px; align-items: stretch; }
  .time { padding-top: 14px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem; text-align: right; color: var(--muted); }
  .spine { position: relative; }
  .spine::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--line); }
  li:first-child .spine::before { top: 22px; }
  li:last-child .spine::before { bottom: calc(100% - 22px); }
  .dot { position: absolute; left: 50%; top: 16px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); }
  li.next .dot { border-color: var(--sun); background: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
  li.done .dot { border-color: var(--done); background: var(--done); }
  .card { display: flex; align-items: center; gap: 12px; margin-block: 5px; padding: 10px 10px 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  li.next .card { border-color: var(--sun); }
  .check { flex: none; width: 32px; height: 32px; border-radius: 9px; border: 2px solid var(--muted); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .check svg { width: 18px; height: 18px; stroke: #fff; opacity: 0; transition: opacity .15s; }
  li.done .check { background: var(--done); border-color: var(--done); }
  li.done .check svg { opacity: 1; }
  .body { flex: 1; min-width: 0; }
  .title { margin: 0; overflow-wrap: anywhere; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .tag { display: inline-block; margin-top: 2px; font-size: .72rem; color: var(--muted); }
  .tag.now { color: var(--sun); font-weight: 700; }
  .del { flex: none; width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 1.2rem; line-height: 1; }
  .del:hover { color: var(--danger); background: var(--bg); }
  .del.edit:hover { color: var(--sun); }
  .title { cursor: text; }
  .editcard { flex-wrap: wrap; }
  .editcard input[type="time"] { width: auto; flex: none; }
  .editcard input[type="text"] { flex: 1 1 140px; min-width: 0; }
  .editcard .submit { padding: 0 16px; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; }

  .empty { padding: 22px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

  form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field.grow { flex: 1 1 200px; }
  label, .field > span { font-size: .8rem; color: var(--muted); }
  input[type="time"], input[type="text"] { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; min-height: 44px; width: 100%; }
  .once { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: .9rem; color: var(--ink); }
  .once input { width: 20px; height: 20px; accent-color: var(--done); }
  .submit { background: var(--ink); color: var(--bg); border: 0; border-radius: 10px; padding: 0 20px; min-height: 44px; font-weight: 700; cursor: pointer; }
  .submit:hover { opacity: .88; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 14px 10px 18px; display: flex; align-items: center; gap: 12px; font-size: .9rem; max-width: calc(100% - 32px); z-index: 20; }
  .toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 32px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .panel.fin { background: var(--done-soft); }
  .streakline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .streakline strong { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.2; }
  .streakline span { color: var(--muted); font-size: .9rem; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wd { display: grid; justify-items: center; gap: 4px; font-size: .75rem; color: var(--muted); }
  .wd b { font-weight: 500; }
  .wd.today b { color: var(--ink); font-weight: 700; }
  .wd i { display: block; width: 100%; max-width: 34px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); }
  .wd i.part { background: var(--sun-soft); border-color: var(--sun); }
  .wd i.all { background: var(--done); border-color: var(--done); }
  .toprow { display: flex; align-items: center; gap: 12px; }
  .toprow .title { flex: 1; min-width: 0; font-weight: 700; cursor: default; }
  .toprow.done .title { text-decoration: line-through; color: var(--muted); }
  .toprow.done .check { background: var(--done); border-color: var(--done); }
  .toprow.done .check svg { opacity: 1; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; }
  .inline input[type="text"] { flex: 1 1 160px; min-width: 0; width: auto; }
  input[type="number"] { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; min-height: 44px; width: 72px; }
  .bibleitem { margin: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .bibleitem strong { font-variant-numeric: tabular-nums; }
  .bibleitem .late { font-size: .72rem; color: var(--green-ink); font-weight: 700; }
  .habits { display: grid; gap: 12px; }
  .habit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 8px; align-items: center; }
  .habit .hname { overflow-wrap: anywhere; }
  .habit .step { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .habit .hcount { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
  .habit.met .hcount { color: var(--done); }
  .hbar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: var(--sun); }
  .habit.met .hbar i { background: var(--done); }
  .memos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .memos li { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .memos .mtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mini { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 32px; font-size: .82rem; }
  .small { margin: 0; color: var(--muted); font-size: .9rem; }

  .duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .duo > .panel, .stack > .panel { padding: 14px 12px; min-width: 0; align-content: start; }
  .stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .glasses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .glass { aspect-ratio: 3 / 4; border: 0; background: transparent; padding: 0; cursor: pointer; }
  .glass svg { width: 100%; height: 100%; display: block; }
  .glass .wo { stroke: var(--blue); }
  .glass .wf { fill: var(--blue); opacity: .55; transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .3s ease; }
  .glass.on .wf { transform: scaleY(1); }
  #waterBox.fin { background: var(--blue-soft); }
  .duo .listhead { flex-wrap: wrap; gap: 2px 8px; }
  .duo .inline { flex-direction: column; }
  .duo .inline input[type="text"] { flex: none; width: 100%; }
  .duo .inline .submit { width: 100%; }
  .duo .supp { gap: 8px; padding: 6px 4px 6px 6px; }
  .duo .capbtn { width: 36px; height: 36px; }
  .duo .del { width: 28px; }
  #bibleBox { border-color: var(--green); }
  #bibleBox h2 { color: var(--green-ink); }
  #bibleBox.fin { background: var(--green-soft); }
  .bluebtn { background: var(--green); color: #07261a; }
  #suppBox { border-color: var(--pink); }
  #suppBox.fin { background: var(--pink-soft); }
  .supph { display: flex; align-items: center; gap: 8px; }
  .suppicon svg, .capbtn svg { width: 24px; height: 24px; display: block; }
  #suppBox svg .cap { fill: none; stroke: var(--pink); }
  #suppBox svg .cap-half { fill: var(--pink-soft); stroke: none; }
  .suppicon .cap-half { fill: var(--pink); }
  .supps { display: grid; gap: 8px; }
  .supp { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .supp.taken { border-color: var(--pink); background: var(--pink-soft); }
  .supp.taken .cap-half { fill: var(--pink); }
  .supp .sname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .supp.taken .sname { text-decoration: line-through; color: var(--muted); }
  .capbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--pink); background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .supp.taken .capbtn { background: var(--pink-soft); }
  .pinkbtn { background: var(--pink); color: #2b1020; }

  .calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .calhead .step { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 1.2rem; line-height: 1; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { text-align: center; font-size: .75rem; color: var(--muted); }
  .cal .day { aspect-ratio: 1; max-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-variant-numeric: tabular-nums; font-size: .85rem; padding: 0; }
  .cal .day.part { background: var(--sun-soft); border-color: var(--sun); }
  .cal .day.all { background: var(--done); border-color: var(--done); color: #fff; font-weight: 700; }
  .cal .day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cal .day.future { opacity: .4; }
  .cal .day.sel { box-shadow: 0 0 0 3px var(--sun-soft); }

  .foot { margin: 0; text-align: center; font-size: .8rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 380px) { ol.rail li { grid-template-columns: 46px 16px minmax(0, 1fr); column-gap: 6px; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="greet" id="greet"></p>
      <h1 id="date"></h1>
    </div>
    <div class="ring" id="ring" role="img" aria-label="오늘 진행률">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="track" cx="32" cy="32" r="26" fill="none" stroke-width="7"/>
        <circle class="bar" id="bar" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
      </svg>
      <div class="count"><span id="count"></span></div>
    </div>
  </header>

  <section class="cheer" id="cheer" aria-live="polite">
    <p class="msg" id="msg"></p>
    <button type="button" id="another" aria-label="다른 한마디 보기" title="다른 한마디 보기">↻</button>
    <p class="status" id="status"></p>
  </section>

  <div class="duo">
  <div class="stack">
  <section class="panel" id="bibleBox" hidden>
    <h2>오늘의 성경 읽기</h2>
    <div id="bibleView"></div>
  </section>

  <section class="panel" id="waterBox">
    <div class="listhead"><h2>물 마시기</h2><span id="waterSum"></span></div>
    <div class="glasses" id="waterGrid"></div>
    <p class="small" id="waterMsg"></p>
  </section>
  </div>

  <section class="panel" id="suppBox">
    <div class="listhead"><h2 class="supph"><span class="suppicon" id="suppIcon"></span>네오미의 서플리</h2><span id="suppSum"></span></div>
    <div class="supps" id="suppList"></div>
    <form class="inline" id="suppForm" autocomplete="off">
      <input type="text" id="suppName" maxlength="24" placeholder="서플리 이름 (예: 오메가3)" aria-label="서플리 이름" required>
      <button class="submit pinkbtn" type="submit">추가</button>
    </form>
  </section>
  </div>

  <section>
    <div class="listhead"><h2>오늘 시간표</h2><span id="sub"></span></div>
    <ol class="rail" id="rail"></ol>
    <div class="empty" id="empty" hidden>아직 할 일이 없어요. 아래에서 시간과 할 일을 추가해 보세요.</div>
  </section>

  <section class="panel">
    <h2>작은 습관</h2>
    <div class="habits" id="habitList"></div>
    <form class="inline" id="habitForm" autocomplete="off">
      <input type="text" id="habitName" maxlength="20" placeholder="습관 이름 (예: 스트레칭)" aria-label="습관 이름" required>
      <input type="number" id="habitGoal" min="1" max="99" value="3" aria-label="하루 목표 횟수" required>
      <button class="submit" type="submit">추가</button>
    </form>
  </section>

  <section class="panel">
    <h2>빠른 메모</h2>
    <form class="inline" id="memoForm" autocomplete="off">
      <input type="text" id="memoText" maxlength="120" placeholder="떠오른 생각을 바로 적어 두세요" aria-label="메모" required>
      <button class="submit" type="submit">저장</button>
    </form>
    <ul class="memos" id="memoList"></ul>
  </section>

  <section class="panel" aria-label="연속 기록">
    <div class="streakline"><strong id="streakNum"></strong><span id="streakNote"></span></div>
    <div class="week" id="week"></div>
  </section>

  <section class="panel">
    <h2>오늘의 가장 중요한 한 가지</h2>
    <div id="topView"></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <h2>할 일 추가</h2>
    <div class="row">
      <div class="field"><label for="newTime">시간</label><input type="time" id="newTime" value="09:00" required></div>
      <div class="field grow"><label for="newTitle">할 일</label><input type="text" id="newTitle" maxlength="60" placeholder="예: 산책 30분" required></div>
    </div>
    <div class="row">
      <label class="once"><input type="checkbox" id="newOnce"> 오늘만 하기</label>
      <button class="submit" type="submit">추가</button>
    </div>
  </form>

  <section class="panel" aria-label="월간 기록">
    <div class="calhead">
      <button type="button" class="step" id="calPrev" aria-label="이전 달">‹</button>
      <h2 id="calTitle"></h2>

</div>

  ];
  var DEFAULT_TASKS = [
    { id: "d1", time: "06:40", title: "성경 읽기", day: null },
    { id: "d2", time: "10:00", title: "환기시키며 청소하기", day: null },
    { id: "d3", time: "21:30", title: "감사한 일 한 줄 적기", day: null }
  ];
  var DEFAULT_HABITS = [];
  var LS_KEY = "today-home-v1";
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  var state = { tasks: DEFAULT_TASKS.slice(), checks: {}, tops: {}, stats: {}, counts: {}, bible: {}, memos: [], habits: DEFAULT_HABITS.slice(), supps: [], suppChecks: {}, water: {} };
  var msgShift = 0;
  var editingId = null;
  var fromMemo = null;
  var lastDeleted = null, toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function today() { return dateKey(new Date()); }

  function normalize(raw) {
    try { raw = JSON.parse(JSON.stringify(raw || {})); } catch (e) { raw = {}; }
    var tasks = Array.isArray(raw && raw.tasks) ? raw.tasks.filter(function (t) { return t && typeof t.title === "string" && /^\d\d:\d\d$/.test(t.time || ""); }) : DEFAULT_TASKS.slice();
    var checks = obj(raw.checks);
    var memos = Array.isArray(raw.memos) ? raw.memos.filter(function (m) { return m && typeof m.text === "string"; }) : [];
    var supps = Array.isArray(raw.supps) ? raw.supps.filter(function (s) { return s && typeof s.name === "string" && s.id; }) : [];
    var habits = Array.isArray(raw.habits) ? raw.habits.filter(function (h) { return h && typeof h.name === "string" && h.goal > 0 && h.id !== "h1"; }) : DEFAULT_HABITS.slice();
    return { tasks: tasks, checks: checks, tops: obj(raw.tops), stats: obj(raw.stats), counts: obj(raw.counts), bible: obj(raw.bible), memos: memos, habits: habits, supps: supps, suppChecks: obj(raw.suppChecks), water: obj(raw.water) };
  }

  function loadLocal() {
    try {
      var s = localStorage.getItem(LS_KEY);
      if (s) state = normalize(JSON.parse(s));
    } catch (e) {}
  }

  function pruneChecks() {
    ["checks", "counts", "tops", "bible", "suppChecks", "water"].forEach(function (f) {
      var keys = Object.keys(state[f]).sort();
      while (keys.length > 60) delete state[f][keys.shift()];
    });
    var sk = Object.keys(state.stats).sort();
    while (sk.length > 800) delete state.stats[sk.shift()];
    if (state.memos.length > 60) state.memos.length = 60;
  }

  function save() {
    var l = visibleTasks();
    state.stats[today()] = { t: l.length, d: l.filter(function (x) { return isDone(x.id); }).length };
    pruneChecks();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    if (!dbDoc) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }

  function flush() {
    if (!dbDoc || saving) { if (saving) saveTimer = setTimeout(flush, 400); return; }
    saving = true;
    var payload = JSON.parse(JSON.stringify(state));
    dbDoc.set(payload).then(function () {
      saving = false;
      if (JSON.stringify(state) !== JSON.stringify(payload)) { saveTimer = setTimeout(flush, 100); }
      else dirty = false;
    }, function () { saving = false; });
  }

  function visibleTasks() {
    var t = today();
    return state.tasks.filter(function (x) { return !x.day || x.day === t; })
      .sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
  }
  function isDone(id) { var c = state.checks[today()]; return !!(c && c[id]); }

  function toggle(id) {
    var t = today();
    var c = state.checks[t] || (state.checks[t] = {});
    if (c[id]) delete c[id]; else c[id] = 1;
    save(); render();
  }

  function removeTask(id) {
    var idx = state.tasks.findIndex(function (x) { return x.id === id; });
    if (idx < 0) return;
    lastDeleted = { task: state.tasks[idx], idx: idx };
    state.tasks.splice(idx, 1);
    save(); render();
    showToast("\"" + lastDeleted.task.title + "\" 삭제했어요", "되돌리기", function () {
      if (!lastDeleted) return;
      state.tasks.splice(Math.min(lastDeleted.idx, state.tasks.length), 0, lastDeleted.task);
      lastDeleted = null; save(); render(); hideToast();
    });
  }

  function showToast(text, actionLabel, action) {
    var el = $("toast");
    el.textContent = "";
    var s = document.createElement("span"); s.textContent = text; el.appendChild(s);
    var b = document.createElement("button"); b.type = "button"; b.textContent = actionLabel; b.addEventListener("click", action); el.appendChild(b);
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $("toast").hidden = true; }

  function nextTaskId(list) {
    var now = new Date(), hm = pad(now.getHours()) + ":" + pad(now.getMinutes());
    var pending = list.filter(function (t) { return !isDone(t.id); });
    if (!pending.length) return null;
    var upcoming = pending.filter(function (t) { return t.time >= hm; });
    return (upcoming[0] || pending[0]).id;
  }

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

  function render() {
    var now = new Date();
    var h = now.getHours();
    $("greet").textContent = h < 5 ? "늦은 밤이에요" : h < 12 ? "좋은 아침이에요" : h < 18 ? "좋은 오후예요" : "편안한 저녁이에요";
    $("date").textContent = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DAYS[now.getDay()] + "요일";

    var list = visibleTasks();
    var doneCount = list.filter(function (t) { return isDone(t.id); }).length;
    var total = list.length;
    var ratio = total ? doneCount / total : 0;
    $("bar").setAttribute("stroke-dashoffset", String(163.36 * (1 - ratio)));
    $("ring").classList.toggle("full", total > 0 && doneCount === total);
    $("ring").setAttribute("aria-label", "오늘 " + total + "개 중 " + doneCount + "개 완료");
    $("count").innerHTML = "";
    var big = document.createElement("span"); big.textContent = doneCount + "/" + total;
    var sm = document.createElement("small"); sm.textContent = "완료";
    $("count").appendChild(big); $("count").appendChild(sm);

    var base = 0, k = today();
    for (var i = 0; i < k.length; i++) base = (base * 31 + k.charCodeAt(i)) % 100003;
    $("msg").textContent = MESSAGES[(base + msgShift) % MESSAGES.length];
    var full = total > 0 && doneCount === total;
    $("cheer").classList.toggle("full", full);
    $("status").textContent = !total ? "오늘의 첫 할 일을 정해 볼까요?" : full ? "오늘 할 일을 모두 마쳤어요. 정말 수고했어요!" : doneCount === 0 ? "천천히 시작해 봐요. 첫 칸만 채우면 돼요." : "좋아요, " + doneCount + "개 해냈어요. 남은 " + (total - doneCount) + "개도 할 수 있어요.";
    $("sub").textContent = total ? "남은 할 일 " + (total - doneCount) + "개" : "";

    var rail = $("rail"), nextId = nextTaskId(list);
    rail.textContent = "";
    $("empty").hidden = total > 0;
    list.forEach(function (t) {
      if (editingId === t.id) {
        var eli = document.createElement("li");
        var etm = document.createElement("div"); etm.className = "time"; etm.textContent = t.time; eli.appendChild(etm);
        var esp = document.createElement("div"); esp.className = "spine"; var edot = document.createElement("span"); edot.className = "dot"; esp.appendChild(edot); eli.appendChild(esp);
        var ef = document.createElement("form"); ef.className = "card editcard";
        var tin = document.createElement("input"); tin.type = "time"; tin.value = t.time; tin.required = true; tin.setAttribute("aria-label", "시간");
        var txt = document.createElement("input"); txt.type = "text"; txt.value = t.title; txt.maxLength = 60; txt.required = true; txt.setAttribute("aria-label", "할 일 내용");
        var sv = document.createElement("button"); sv.type = "submit"; sv.className = "submit"; sv.textContent = "저장";
        var cn = document.createElement("button"); cn.type = "button"; cn.className = "ghost"; cn.textContent = "취소";
        ef.addEventListener("submit", function (e) {
          e.preventDefault();
          var nt = txt.value.trim();
          if (!nt || !/^\d\d:\d\d$/.test(tin.value)) return;
          t.title = nt; t.time = tin.value; editingId = null; save(); render();
        });
        cn.addEventListener("click", function () { editingId = null; render(); });
        ef.appendChild(tin); ef.appendChild(txt); ef.appendChild(sv); ef.appendChild(cn);
        eli.appendChild(ef); rail.appendChild(eli);
        setTimeout(function () { txt.focus(); }, 0);
        return;
      }
      var done = isDone(t.id);
      var li = document.createElement("li");
      if (done) li.className = "done"; else if (t.id === nextId) li.className = "next";

      var tm = document.createElement("div"); tm.className = "time"; tm.textContent = t.time; li.appendChild(tm);
      var sp = document.createElement("div"); sp.className = "spine"; var dot = document.createElement("span"); dot.className = "dot"; sp.appendChild(dot); li.appendChild(sp);

      var card = document.createElement("div"); card.className = "card";
      var cb = document.createElement("button"); cb.type = "button"; cb.className = "check"; cb.innerHTML = CHECK_SVG;
      cb.setAttribute("aria-pressed", done ? "true" : "false");
      cb.setAttribute("aria-label", t.title + (done ? " 완료 취소" : " 완료로 표시"));
      cb.addEventListener("click", function () { toggle(t.id); });
      var body = document.createElement("div"); body.className = "body";
      var ti = document.createElement("p"); ti.className = "title"; ti.textContent = t.title; body.appendChild(ti);

      if (t.day) tagText.push("오늘만");
      if (!done && t.id === nextId) { var n = document.createElement("span"); n.className = "tag now"; n.textContent = "다음 할 일" + (t.day ? " · 오늘만" : ""); body.appendChild(n); }

      var del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "\u00d7"; del.setAttribute("aria-label", t.title + " 삭제");
      del.addEventListener("click", function () { removeTask(t.id); });
      var ed = document.createElement("button"); ed.type = "button"; ed.className = "del edit"; ed.textContent = "✎"; ed.setAttribute("aria-label", t.title + " 수정");
      ed.addEventListener("click", function () { editingId = t.id; render(); });
      ti.addEventListener("click", function () { editingId = t.id; render(); });
      card.appendChild(cb); card.appendChild(body); card.appendChild(ed); card.appendChild(del);
      li.appendChild(card);
      rail.appendChild(li);
    });
    renderExtras();
  }

  /* ---------- 추가 기능: 연속 기록, 오늘의 한 가지, 성경 읽기표, 습관, 메모 ---------- */
  var PLAN = [
    { n: 139, date: "2026-11-16", text: "고린도전서 5-14" },

    { n: 142, date: "2026-11-19", text: "에베소서, 빌립보서" },

    { n: 144, date: "2026-11-21", text: "디모데전·후서, 디도서, 빌레몬서" },

    { n: 146, date: "2026-11-23", text: "히브리서 1-7" },
    { n: 147, date: "2026-11-24", text: "히브리서 8-13, 야고보서, 벧전" },
    { n: 148, date: "2026-11-25", text: "벧후, 요한123서, 유다서" },
    { n: 149, date: "2026-11-26", text: "요한계시록 1-12" },
    { n: 150, date: "2026-11-27", text: "요한계시록 13-22" }
  ];

  function obj(x) { return x && typeof x === "object" && !Array.isArray(x) ? x : {}; }
  function uid() { return Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d; }
  function md(k) { var p = k.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]); return (+p[1]) + "/" + (+p[2]) + "(" + DAYS[d.getDay()] + ")"; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderExtras() { renderStreak(); renderCal(); renderSupps(); renderWater(); renderTop(); renderBible(); renderHabits(); renderMemos(); }

  function dayStatus(k) {
    var s = state.stats[k];
    if (k === today()) { var l = visibleTasks(); s = { t: l.length, d: l.filter(function (x) { return isDone(x.id); }).length }; }
    if (!s || !s.t) return "none";

  }

  function renderStreak() {
    var n = 0, i = dayStatus(today()) === "all" ? 0 : 1;
    while (i < 400 && dayStatus(dateKey(daysAgo(i))) === "all") { n++; i++; }
    $("streakNum").textContent = n > 0 ? n + "일 연속 완료" : "연속 기록 0일";
    var week = $("week"), allCnt = 0;
    week.textContent = "";
    for (var j = 6; j >= 0; j--) {

      week.appendChild(cell);

    $("streakNote").textContent = "최근 7일 중 " + allCnt + "일 모두 완료";
  }

  function renderTop() {
    var v = $("topView"), k = today(), cur = state.tops[k];

  function renderBible() {
    var box = $("bibleBox"), v = $("bibleView"), t = today();
    if (t < PLAN[0].date || t > PLAN[PLAN.length - 1].date) { box.hidden = true; return; }
    box.hidden = false; v.textContent = "";
    var upto = PLAN.filter(function (e) { return e.date <= t && e.text; });
    var pending = upto.filter(function (e) { return !state.bible[e.date]; });
    var todayEntry = PLAN.filter(function (e) { return e.date === t; })[0];
    var shown = pending.length ? pending : (todayEntry && todayEntry.text ? [todayEntry] : []);
    box.classList.toggle("fin", !pending.length && shown.length > 0);
    if (!shown.length) { v.appendChild(el("p", "small", "오늘은 주일이에요. 읽기표에는 쉬는 날이에요.")); return; }
    var wrap = el("div"); wrap.style.display = "grid"; wrap.style.gap = "8px";
    shown.forEach(function (e) {
      var p = el("p", "bibleitem");
      p.appendChild(el("strong", "", e.n + "일차"));
      p.appendChild(el("span", "", md(e.date) + " · " + e.text));

      wrap.appendChild(p);
    });
    v.appendChild(wrap);
    var btn = el("button", "submit bluebtn", pending.length ? (pending.length > 1 ? "모두 읽었어요" : "읽었어요") : "읽기 완료 · 취소");
    btn.type = "button"; btn.style.justifySelf = "start"; btn.style.marginTop = "12px";
    btn.addEventListener("click", function () {
      if (pending.length) pending.forEach(function (e) { state.bible[e.date] = 1; });
      else if (todayEntry) delete state.bible[todayEntry.date];
      save(); render();
    });
    v.appendChild(btn);
  }

  var WATER_GOAL = 8;
  var GLASS_SVG = '<svg viewBox="0 0 24 32" aria-hidden="true"><path class="wf" d="M4.1 10h15.8l-1.7 18a1.2 1.2 0 0 1-1.2 1H7a1.2 1.2 0 0 1-1.2-1z"/><path class="wo" d="M3 3h18l-2.2 25a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>';

  function renderWater() {
    var grid = $("waterGrid"), n = state.water[today()] || 0;
    if (grid.children.length !== WATER_GOAL) {
      grid.textContent = "";
      for (var i = 1; i <= WATER_GOAL; i++) {
        (function (i) {
          var b = el("button", "glass"); b.type = "button"; b.innerHTML = GLASS_SVG;
          b.addEventListener("click", function () {
            var k = today(), cur = state.water[k] || 0;
            state.water[k] = (i === cur) ? i - 1 : i;
            save(); renderWater();
          });
          grid.appendChild(b);
        })(i);
      }
    }
    for (var j = 0; j < WATER_GOAL; j++) {
      var g = grid.children[j], on = (j + 1) <= n;
      g.classList.toggle("on", on);
      g.setAttribute("aria-pressed", on ? "true" : "false");
      g.setAttribute("aria-label", (j + 1) + "번째 물잔" + (on ? " 채움" : ""));
    }
    $("waterSum").textContent = n + "/" + WATER_GOAL + "잔";
    $("waterBox").classList.toggle("fin", n >= WATER_GOAL);
    $("waterMsg").textContent = n >= WATER_GOAL ? "오늘 물 목표를 채웠어요!" : "마실 때마다 물잔을 눌러 채워요.";
  }

  var CAP_SVG ='<svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-45 16 16)"><rect class="cap" x="3" y="10" width="26" height="12" rx="6" stroke-width="2"/><path class="cap-half" d="M16 10h7a6 6 0 0 1 0 12h-7z"/><line class="cap" x1="16" y1="10" x2="16" y2="22" stroke-width="2"/></g></svg>';

  function renderSupps() {
    $("suppIcon").innerHTML = CAP_SVG;
    var list = $("suppList"), c = state.suppChecks[today()] || {};
    var total = state.supps.length, taken = state.supps.filter(function (s) { return c[s.id]; }).length;
    list.textContent = "";
    $("suppSum").textContent = total ? taken + "/" + total + " 먹었어요" : "";
    $("suppBox").classList.toggle("fin", total > 0 && taken === total);
    if (!total) { list.appendChild(el("p", "small", "먹는 서플리를 아래에 추가해 보세요. 매일 아침 자동으로 다시 나타나요.")); return; }
    state.supps.forEach(function (s) {
      var on = !!c[s.id];
      var row = el("div", "supp" + (on ? " taken" : ""));
      var cb = el("button", "capbtn"); cb.type = "button"; cb.innerHTML = CAP_SVG;
      cb.setAttribute("aria-pressed", on ? "true" : "false");
      cb.setAttribute("aria-label", s.name + (on ? " 먹음 취소" : " 먹었어요"));
      cb.addEventListener("click", function () {
        var k = today(), cc = state.suppChecks[k] || (state.suppChecks[k] = {});
        if (cc[s.id]) delete cc[s.id]; else cc[s.id] = 1;
        save(); render();
      });
      var del = el("button", "del", "×"); del.type = "button"; del.setAttribute("aria-label", s.name + " 삭제");
      del.addEventListener("click", function () {
        var idx = state.supps.findIndex(function (x) { return x.id === s.id; });
        if (idx < 0) return;
        state.supps.splice(idx, 1); save(); render();
        showToast("\"" + s.name + "\" 삭제했어요", "되돌리기", function () { state.supps.splice(Math.min(idx, state.supps.length), 0, s); save(); render(); hideToast(); });
      });
      row.appendChild(cb); row.appendChild(el("span", "sname", s.name)); row.appendChild(del);
      list.appendChild(row);
    });
  }

  $("suppForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("suppName").value.trim(); if (!name) return;
    state.supps.push({ id: "s" + uid(), name: name });
    $("suppName").value = ""; save(); render();
  });

  var calView = null, calSel = null;

  function dayCounts(k) {
    if (k === today()) { var l = visibleTasks(); return { t: l.length, d: l.filter(function (x) { return isDone(x.id); }).length }; }
    var s = state.stats[k];
    return s && s.t ? { t: s.t, d: s.d } : null;
  }

  function renderCal() {
    var now = new Date(), todayK = today();
    if (!calView) calView = { y: now.getFullYear(), m: now.getMonth() };
    var first = new Date(calView.y, calView.m, 1), dim = new Date(calView.y, calView.m + 1, 0).getDate();
    $("calTitle").textContent = calView.y + "년 " + (calView.m + 1) + "월";
    var cal = $("cal"); cal.textContent = "";
    DAYS.forEach(function (d) { cal.appendChild(el("div", "dow", d)); });
    for (var b = 0; b < first.getDay(); b++) cal.appendChild(el("div"));
    var allCnt = 0, tracked = 0, ratioSum = 0;
    for (var d = 1; d <= dim; d++) {
      (function (d) {
        var k = dateKey(new Date(calView.y, calView.m, d)), c = dayCounts(k);
        var cls = "day";
        if (c) { cls += c.d >= c.t ? " all" : c.d > 0 ? " part" : ""; if (k <= todayK) { tracked++; ratioSum += c.d / c.t; if (c.d >= c.t) allCnt++; } }
        if (k === todayK) cls += " today";
        if (k > todayK) cls += " future";
        if (k === calSel) cls += " sel";
        var btn = el("button", cls, String(d)); btn.type = "button";
        btn.setAttribute("aria-label", md(k) + (c ? " " + c.t + "개 중 " + c.d + "개 완료" : " 기록 없음"));
        btn.addEventListener("click", function () { calSel = k; renderCal(); });
        cal.appendChild(btn);
      })(d);
    }
    $("calSum").textContent = tracked ? "이 달 기록 " + tracked + "일 · 모두 완료 " + allCnt + "일 · 평균 " + Math.round(ratioSum / tracked * 100) + "%" : "이 달 기록이 아직 없어요. 체크하면 여기에 쌓여요.";
    var cd = calSel && dayCounts(calSel);
    $("calDetail").textContent = calSel ? md(calSel) + (cd ? " · 할 일 " + cd.t + "개 중 " + cd.d + "개 완료" : " · 기록이 없어요") : "날짜를 누르면 그날 기록을 볼 수 있어요.";
  }

  function moveMonth(delta) {
    var d = new Date(calView.y, calView.m + delta, 1);
    calView = { y: d.getFullYear(), m: d.getMonth() };
    renderCal();
  }
  $("calPrev").addEventListener("click", function () { moveMonth(-1); });
  $("calNext").addEventListener("click", function () { moveMonth(1); });

  function bump(id, delta) {
    var k = today(), c = state.counts[k] || (state.counts[k] = {});
    c[id] = Math.max(0, (c[id] || 0) + delta);
    save(); render();
  }

  function removeHabit(id) {
    var idx = state.habits.findIndex(function (h) { return h.id === id; });
    if (idx < 0) return;
    var h = state.habits[idx];
    state.habits.splice(idx, 1); save(); render();
    showToast("\"" + h.name + "\" 삭제했어요", "되돌리기", function () {
      state.habits.splice(Math.min(idx, state.habits.length), 0, h); save(); render(); hideToast();
    });
  }

  function renderHabits() {
    var list = $("habitList"), c = state.counts[today()] || {};
    list.textContent = "";
    if (!state.habits.length) { list.appendChild(el("p", "small", "아직 습관이 없어요. 아래에서 추가해 보세요.")); return; }
    state.habits.forEach(function (h) {
      var n = c[h.id] || 0;
      var row = el("div", "habit" + (n >= h.goal ? " met" : ""));
      row.appendChild(el("span", "hname", h.name));
      var minus = el("button", "step", "−"); minus.type = "button"; minus.setAttribute("aria-label", h.name + " 한 번 줄이기");
      minus.addEventListener("click", function () { bump(h.id, -1); });
      var plus = el("button", "step", "+"); plus.type = "button"; plus.setAttribute("aria-label", h.name + " 한 번 늘리기");
      plus.addEventListener("click", function () { bump(h.id, 1); });
      var del = el("button", "del", "×"); del.type = "button"; del.setAttribute("aria-label", h.name + " 삭제");
      del.addEventListener("click", function () { removeHabit(h.id); });
      row.appendChild(minus); row.appendChild(el("span", "hcount", n + "/" + h.goal)); row.appendChild(plus); row.appendChild(del);
      var bar = el("div", "hbar"), fill = el("i"); fill.style.width = Math.min(100, Math.round(n / h.goal * 100)) + "%"; bar.appendChild(fill);
      row.appendChild(bar);
      list.appendChild(row);
    });
  }

  function renderMemos() {
    var list = $("memoList");
    list.textContent = "";
    state.memos.forEach(function (m) {
      var li = el("li");
      li.appendChild(el("span", "mtext", m.text));
      var to = el("button", "mini", "할 일로"); to.type = "button"; to.setAttribute("aria-label", "이 메모를 할 일로 만들기");
      to.addEventListener("click", function () {
        fromMemo = m.id; $("newTitle").value = m.text.slice(0, 60);
        $("addForm").scrollIntoView({ behavior: "smooth", block: "center" });
        $("newTitle").focus();
      });
      var del = el("button", "del", "×"); del.type = "button"; del.setAttribute("aria-label", "메모 삭제");
      del.addEventListener("click", function () {
        var idx = state.memos.indexOf(m); if (idx < 0) return;
        state.memos.splice(idx, 1); save(); render();
        showToast("메모를 삭제했어요", "되돌리기", function () { state.memos.splice(Math.min(idx, state.memos.length), 0, m); save(); render(); hideToast(); });
      });
      li.appendChild(to); li.appendChild(del);
      list.appendChild(li);
    });
  }

  $("habitForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("habitName").value.trim(), goal = parseInt($("habitGoal").value, 10);
    if (!name || !(goal > 0)) return;
    state.habits.push({ id: "h" + uid(), name: name, goal: Math.min(goal, 99) });
    $("habitName").value = ""; save(); render();
  });

  $("memoForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var tx = $("memoText").value.trim(); if (!tx) return;
    state.memos.unshift({ id: "m" + uid(), text: tx });
    $("memoText").value = ""; save(); render();
  });

  $("another").addEventListener("click", function () { msgShift = (msgShift + 1) % MESSAGES.length; render(); });

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("newTitle").value.trim(), time = $("newTime").value;
    if (!title || !/^\d\d:\d\d$/.test(time)) return;
    state.tasks.push({ id: "t" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36), time: time, title: title, day: $("newOnce").checked ? today() : null });
    $("newTitle").value = ""; $("newOnce").checked = false;
    if (fromMemo) {
      var mi = state.memos.findIndex(function (m) { return m.id === fromMemo; });
      if (mi >= 0) state.memos.splice(mi, 1);
      fromMemo = null;
    }
    save(); render();
  });

  loadLocal();
  render();
  setInterval(function () {
    var a = document.activeElement;
    if (editingId === null && !(a && a.tagName === "INPUT" && $("topView").contains(a))) render();
  }, 60000);

  // 저장소(db)가 연결되면 기기 사이에서도 같은 기록을 씁니다. 연결되지 않으면 이 브라우저에만 저장돼요.
  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      var user = await window.claude.use("user");
      var db = await window.claude.use("db");
      var id = user && (await user.id());
      if (!db || !id) return;
      var ref = db.doc("data/users/" + id + "/planner");
      var first = true;
      ref.onSnapshot(function (snap) {
        if (dirty || saving) return;
        if (snap.exists) { state = normalize(snap.data()); try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} render(); }
        else if (first) { dbDoc = ref; save(); }
        dbDoc = ref; first = false;
      }, function () {});
      dbDoc = ref;
    } catch (e) {}
  })();
})();
</script>

</body></html>
